upstream tuoxin_pay {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pay.example.com;

    # ssl_certificate and ssl_certificate_key are managed by your panel/ACME client.

    # TunexPay appliance exposes one public port. The internal gateway routes
    # API/ePay requests to Hono and all other requests to Next.js.
    location / {
        proxy_pass http://tuoxin_pay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
