upstream tuoxin_pay_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream tuoxin_pay_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pay.example.com;

    # ssl_certificate and ssl_certificate_key are managed by your panel/ACME client.

    # This path belongs to the Next.js server-side admin proxy.
    location ^~ /api/backend/ {
        proxy_pass http://tuoxin_pay_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(api/v1/|admin/v1/|submit\.php$|mapi\.php$|api\.php$|health$) {
        proxy_pass http://tuoxin_pay_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://tuoxin_pay_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
